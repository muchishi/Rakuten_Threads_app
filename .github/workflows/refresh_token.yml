name: Refresh Threads Token

on:
  schedule:
    - cron: "0 0 * * 0"  # 毎週日曜 0:00 UTC（60日有効なトークンを週1で更新）
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PATH }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh token
        run: python refresh_threads_token.py
